name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[geo,api,dev]"
      - name: Lint
        run: python -m ruff check src tests scripts
      - name: Tests (no Earth Engine, no database)
        run: python -m pytest -m "not gee and not db"
