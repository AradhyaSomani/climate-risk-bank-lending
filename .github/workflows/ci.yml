name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[geo,api,dev]"
      - name: Lint
        run: python -m ruff check src tests scripts
      - name: Contract validators on the toy samples
        run: python -m cri.contracts --samples
      - name: Tests (no Earth Engine, no database)
        run: python -m pytest -m "not gee and not db"
      - name: API end to end on the contract samples
        env:
          CRI_API_SOURCE: sample
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from cri.api.app import create_app
          c = TestClient(create_app())
          for path in ["/health", "/districts", "/hazard-scores", "/events", "/scenarios",
                       "/effects", "/stress-results"]:
              r = c.get(path)
              assert r.status_code == 200, (path, r.text)
              print(path, r.json().get("n"))
          PY
