# Districts created after the Census 2011 boundaries were frozen. Each maps with weight 1 to
# the Census 2011 district it was mostly carved from (`parent`). `also_from` lists other
# Census 2011 districts that gave it territory: population weights cannot be computed for
# those without sub-district data, so the whole district goes to the main parent and every
# 2011 district named here gets split_flag = True (contract C1). Sources: state gazette
# notifications as summarised on each district's Wikipedia page, checked against the drop in
# RBI office counts in the quarter the new district first appears
# (data/interim/crosswalk_review.csv, column office_drop).
