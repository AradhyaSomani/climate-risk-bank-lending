# Phase 1 B: how RBI's district names map to Census 2011 districts (contract C1).
#
# Read by cri.geo.crosswalk together with configs/district_aliases.yaml (Person A's list of
# later names for Census 2011 districts, also used for EM-DAT). A name is resolved in this
# order: `names` and `new_districts` below, then district_aliases.yaml, then an exact or
# normalised match on the Census 2011 name. A name that none of these resolves stops the
# build and is written to data/interim/crosswalk_review.csv with a fuzzy suggestion, so
# every non-exact match is a decision recorded here, never an automatic fuzzy match.
#
# Keys under `names` and `new_districts` are the Census 2011 state, as in the boundary file.
# District names are matched after cri.geo.names.normalise (case, punctuation, "district").

# RBI state label -> Census 2011 state(s). A list means the district names are looked up in
# each of those states (the 2020 merger of Dadra & Nagar Haveli with Daman & Diu).
states:
  TELANGANA: Andhra Pradesh
  LADAKH: Jammu & Kashmir
  ARUNACHAL PRADESH: Arunanchal Pradesh
  DADRA & NAGAR HAVELI: Dadara & Nagar Havelli
  DADRA AND NAGAR HAVELI AND DAMAN AND DIU: [Dadara & Nagar Havelli, Daman & Diu]
  ANDAMAN & NICOBAR ISLANDS: Andaman & Nicobar Island
  NCT OF DELHI: NCT of Delhi

# Same district, other spelling or a later name (weight 1, every quarter).
