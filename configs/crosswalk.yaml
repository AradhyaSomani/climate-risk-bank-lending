# RBI labels that stand for a whole state or territory with several Census 2011 districts.
# RBI prints Delhi as one district, "NEW DELHI"; it is shared among the nine Census 2011
# districts of Delhi by population (match_type "split"), and all nine are flagged.
state_wide_labels:
  NCT of Delhi: [NEW DELHI]

# Districts whose pre-split figures are shared by population although population is a poor
# guide to where credit sits (a financial centre split from its suburbs). Flagged too.
poor_population_proxy:
  Maharashtra: [Mumbai, Mumbai Suburban]
  NCT of Delhi: [North West, North, North East, East, New Delhi, Central, West, South West, South]
