# Census 2011 districts created between 2004 and 2011. Until a district first appears in
# RBI's tables (found from the data), its figures sit inside its parent's, so the parent's
# RBI row is shared between the parent and the children not yet reported, in proportion to
# their Census 2011 population (the CEDA rule). These rows get match_type "split" and count
# towards the panel's imputed_share. `also_from` works as above (split_flag).
#
# Districts that appear late only because RBI does not print districts with fewer than three
# offices (East Kameng, Lower Dibang Valley, Upper Siang, Lawangtlai, Peren, Longleng,
# Kiphire, Yanam) are not listed: their early quarters are missing, not inside a parent.
pre_2011_children:
