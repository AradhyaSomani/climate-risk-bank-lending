# Names that later sources (EM-DAT, GADM, news text) use for places that are a different
# district, or a differently spelled one, in the Census 2011 district map.
#
# states: a state formed or renamed after 2011 -> the Census 2011 state that held it.
# districts: per Census 2011 state, later name -> Census 2011 district name. A district
# carved out after 2011 maps to the district it was carved from (the main parent when
# there were several), so a record about it lands on the 2011 polygon that holds it.
# Every target must be a district name in the boundary file; tests/ingest/test_emdat.py
# checks this whenever the boundaries are present.

states:
  Telangana: Andhra Pradesh        # split from Andhra Pradesh in 2014
  Ladakh: Jammu & Kashmir          # union territory since 2019

