# Annual BSR district credit by occupation (Table 5.9 / 3.9), cri.ingest.rbi_annual.

# Annual state names spelt as the quarterly statement spells them (the crosswalk's states)
states:
  A&N ISLANDS: ANDAMAN & NICOBAR ISLANDS
  ANDAMAN & NICOBAR: ANDAMAN & NICOBAR ISLANDS
  ANDAMAN AND NICOBAR ISLANDS: ANDAMAN & NICOBAR ISLANDS
  CHATTISGARH: CHHATTISGARH
  DADRA&NAGAR HAVELI: DADRA & NAGAR HAVELI
  DELHI: NCT OF DELHI
  ORISSA: ODISHA
  PONDICHERRY: PUDUCHERRY
  UTTARANCHAL: UTTARAKHAND
  TAMILNADU: TAMIL NADU

# District columns that RBI's table labels wrongly. `nth` counts the label's appearances in
# the state's sheet, left to right and block by block, starting from 1.
relabel:
  - year: 2009
    state: ANDAMAN & NICOBAR
    district: NICOBAR
    nth: 2
    rename: SOUTH ANDAMAN
    reason: >-
      The March 2009 sheet heads its third column NICOBAR a second time; it is South Andaman
      (Port Blair), the islands' largest credit district, which has no column of its own that
      year and appears in every other year.

# A district's occupations must add up to its total where the table gives one, within this
# share of the total
total_tolerance: 0.01

# Years whose title row states the wrong unit. The 2005 and 2006 sheets say "Rupees Lakh",
# but read in lakh their all-India total would be 115 and 151 lakh crore, against 8.8 in 2004
# and 19.4 in 2007 (the other years state thousand); in thousand they fall on the trend
# (11.5 and 15.1 lakh crore).
unit_override:
  2005: thousand
  2006: thousand

# District columns that repeat another district's figures exactly: unusable, left out.
drop:
  - year: 2006
    state: HARYANA
    districts: [KAITHAL, PANIPAT, KARNAL, REWARI, KURUKSHETRA, ROHTAK, MAHENDRAGARH, SIRSA,
                MEWAT, SONIPAT, PANCHKULA, YAMUNANAGAR]
    reason: >-
      The March 2006 Haryana sheet repeats six districts' columns under six other names
      (Panipat = Kaithal, Rewari = Karnal, Rohtak = Kurukshetra, Sirsa = Mahendragarh,
      Sonipat = Mewat, Yamunanagar = Panchkula); which of each pair is right cannot be told.

# All-India credit must not change by more than this factor from one year to the next (a
# check on units)
max_yearly_factor: 1.6

# Labels merged before mapping (annual label -> label it is added to), per RBI state. In March
# 2019 alone the table splits Delhi into its eleven revenue districts; every other year it has
# one DELHI label, so 2019 is added back to that label to keep the years comparable.
merge:
  NCT OF DELHI:
    CENTRAL DELHI: DELHI
    EAST DELHI: DELHI
    NEW DELHI: DELHI
    NORTH DELHI: DELHI
    NORTH-EAST DELHI: DELHI
    NORTH-WEST DELHI: DELHI
    SHAHDARA: DELHI
    SOUTH DELHI: DELHI
    SOUTH-EAST DELHI: DELHI
    SOUTH-WEST DELHI: DELHI
    WEST DELHI: DELHI

# Additions to configs/crosswalk.yaml for labels only the annual tables use (same structure
