# Large state policy shocks that can move district credit on their own (Phase 1 D). A flag
# in the quarter each began. Nationwide shocks (demonetisation, November 2016; GST, July
# 2017; the COVID-19 lockdown, March 2020; the RBI loan moratorium, March to August 2020)
# hit every district at once, so the quarter fixed effects absorb them and they are not
# listed here.
state_shocks:
  - {state: Andhra Pradesh, date: 2010-10-15, name: Andhra Pradesh microfinance ordinance, source: "Andhra Pradesh Micro Finance Institutions (Regulation of Money Lending) Ordinance, 2010; RBI Malegam Committee report (January 2011)", checked: false}
  - {state: Andhra Pradesh, date: 2014-06-02, name: Andhra Pradesh bifurcation, source: "Andhra Pradesh Reorganisation Act, 2014 (appointed day 2 June 2014)", checked: false}
  - {state: Jammu & Kashmir, date: 2016-07-08, name: Kashmir unrest and curfews, source: "Press reports of the curfews from July 2016", checked: false}
  - {state: Jammu & Kashmir, date: 2019-08-05, name: Article 370 revoked and communications shutdown, source: "Constitution (Application to Jammu and Kashmir) Order, 2019; Jammu and Kashmir Reorganisation Act, 2019", checked: false}
  - {state: Manipur, date: 2023-05-03, name: Manipur ethnic violence, source: "Press reports from 3 May 2023; internet shutdown orders of the Manipur government", checked: false}
