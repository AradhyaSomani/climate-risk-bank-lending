# Elections (Phase 1 D). Agricultural credit from public-sector banks rises in the year
# before a state election (Cole 2009, AEJ: Applied 1(1)), so the quarter of each result and
# the quarters until the next one are controls. `results` is the day the Election Commission
# of India declared the results (counting day); state names are the Census 2011 spellings in
# the district master. States without an assembly (Andaman and Nicobar, Chandigarh, Dadra
# and Nagar Haveli, Daman and Diu, Lakshadweep) have none. Elections whose results came
# before 2004 are left out: only the next result matters for the window. `checked: false`
# means the date is from the ECI results pages as reported in the press and still to be
# checked against the ECI statistical report for that election.
general_elections: [2004-05-13, 2009-05-16, 2014-05-16, 2019-05-23, 2024-06-04]

