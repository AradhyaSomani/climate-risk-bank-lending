[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cri"
version = "0.1.0"
description = "Climate risk in Indian bank lending: hazard, exposure, event study and stress test"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Aradhya Somani" },
  { name = "Devna Roopesh" },
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=14",
  "pyyaml>=6",
  "scipy>=1.11",
]

[project.optional-dependencies]
# Geospatial work (district geometry, zonal statistics, cyclone footprints)
geo = [
  "geopandas>=0.14",
  "shapely>=2.0",
  "pyproj>=3.6",
]
# Earth Engine pulls (Global Flood Database, Sentinel-1, JRC water, HAND)
gee = ["earthengine-api>=0.1.380"]
# Models in src/cri/ml
ml = [
  "scikit-learn>=1.3",
  "torch>=2.1",
  "mlflow>=2.9",
]
# Warehouse and API
db = ["psycopg[binary]>=3.1"]
api = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
]
dev = [
  "pytest>=8",
  "ruff>=0.4",
  "dvc>=3.30",
  "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
  "gee: needs Earth Engine credentials (skipped in CI)",
  "db: needs a running PostGIS database (skipped in CI)",
  "slow: longer than a few seconds",
]
