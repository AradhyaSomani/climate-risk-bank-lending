contract: C4
producer: A
consumer: B
description: >
  Event catalogue and per-district treatment flags. Treatment and exclusion rules live in
  configs/events.yaml and are fixed before outcomes are examined.
tables:
  events:
    file: data/processed/events.parquet
    sample: tests/fixtures/contracts/events.csv
    primary_key: [event_id]
    columns:
      event_id: {dtype: str}
      hazard_type: {dtype: str, allowed: [flood, cyclone]}
      name: {dtype: str}
      start_date: {dtype: date}
      end_date: {dtype: date, nullable: true}
      impact_quarter: {dtype: date, quarter_end: true, description: quarter-end date of the impact quarter}
      states: {dtype: str, description: semicolon-separated state names}
      source: {dtype: str}
      emdat_id: {dtype: str, nullable: true}
  event_district:
    file: data/processed/event_district.parquet
    sample: tests/fixtures/contracts/event_district.csv
    primary_key: [event_id, district_id]
    columns:
      event_id: {dtype: str}
      district_id: {dtype: int}
      flooded_share: {dtype: float, min: 0, max: 1, nullable: true}
      flooded_built_share: {dtype: float, min: 0, max: 1, nullable: true}
      track_dist_km: {dtype: float, min: 0, nullable: true}
      max_wind_kt: {dtype: float, min: 0, nullable: true}
      treated: {dtype: bool}
      heavily_treated: {dtype: bool}
      excluded: {dtype: bool, description: in the exclusion zone; kept out of the main control pool}
    checks:
      - {kind: implies, if: heavily_treated, then: treated}
      - {kind: not_both, columns: [treated, excluded]}
  scenarios:
    file: data/processed/scenarios.parquet
    sample: tests/fixtures/contracts/scenarios.csv
    primary_key: [scenario_id]
    columns:
      scenario_id: {dtype: str}
      scenario_type: {dtype: str, allowed: [replay, shifted, scaled, compound, generated]}
      source_event: {dtype: str, description: event_id in events.parquet (the first one for a compound)}
      hazard_type: {dtype: str, allowed: [flood, cyclone, flood+cyclone, cyclone+flood, cyclone+cyclone, flood+flood]}
      severity: {dtype: float, min: 0, description: intensity multiplier (1 = as observed)}
      hypothetical: {dtype: bool}
      n_districts: {dtype: int, min: 0, description: 0 = no footprint yet; not usable}
      description: {dtype: str}
      assumptions: {dtype: str}
  scenario_district:
    file: data/processed/scenario_district.parquet
    sample: tests/fixtures/contracts/scenario_district.csv
    primary_key: [scenario_id, district_id]
    columns:
      scenario_id: {dtype: str}
      district_id: {dtype: int}
      intensity: {dtype: float, min: 0, description: flooded share (floods) or wind kt at closest approach (cyclones)}
      heavily_treated: {dtype: bool}
      beyond_observed: {dtype: bool, description: intensity above the largest in the event catalogue}
