contract: C1
producer: B
consumer: A
description: >
  Census 2011 district master and the crosswalk from RBI district names to 2011 districts.
  Population weights, not area weights (CEDA concordance convention).
tables:
  district_master:
    file: data/processed/district_master.parquet
    sample: tests/fixtures/contracts/district_master.csv
    primary_key: [district_id]
    columns:
      district_id: {dtype: int, description: Census 2011 district code}
      name: {dtype: str}
      state: {dtype: str}
      population: {dtype: int, min: 0}
      area_km2: {dtype: float, min: 0, exclusive_min: true}
      urban_share: {dtype: float, min: 0, max: 1, nullable: true}
      geometry: {dtype: geometry, description: MultiPolygon in EPSG:4326 (WKT in CSV samples)}
  crosswalk_rbi_to_c2011:
    file: data/processed/crosswalk_rbi_to_c2011.parquet
    sample: tests/fixtures/contracts/crosswalk_rbi_to_c2011.csv
    primary_key: [rbi_name, rbi_state, valid_from, district_id]
    columns:
      rbi_name: {dtype: str}
      rbi_state: {dtype: str}
      valid_from: {dtype: date}
      valid_to: {dtype: date, nullable: true, description: null means still valid}
      district_id: {dtype: int}
      weight: {dtype: float, min: 0, max: 1, exclusive_min: true}
      split_flag: {dtype: bool, description: boundary change poorly approximated by population weights}
    checks:
      - {kind: sum_to_one, column: weight, by: [rbi_name, rbi_state, valid_from], tol: 1.0e-6}
